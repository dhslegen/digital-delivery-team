# DDT v0.9.11 D28 · node-modern preset 基础组件 docker-compose
#
# 用途：被 bin/integrate-up.mjs 在用户项目根没有 docker-compose.yml 时复制使用。
# 启动：docker compose up -d
#
# 端口约定：
#   5432  PostgreSQL
#   6379  Redis
#   ddt-app-network 共享网络让 app 进程可访问

services:
  postgres:
    image: postgres:16-alpine
    container_name: ddt-postgres
    environment:
      POSTGRES_DB: ddt_dev
      POSTGRES_USER: ddt
      POSTGRES_PASSWORD: ddt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddt -d ddt_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ddt-app-network

  redis:
    image: redis:7-alpine
    container_name: ddt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ddt-app-network

volumes:
  postgres_data:
  redis_data:

networks:
  ddt-app-network:
    driver: bridge
